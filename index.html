<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>ЕГЭ 2026 — Авторизация и выбор предмета</title>
<style>
:root{--bg:#0f172a;--card:#1e293b;--hover:#334155;--text:#f8fafc;--muted:#94a3b8;--accent:#3b82f6;--success:#10b981;--border:#334155}
[data-theme="light"]{--bg:#f1f5f9;--card:#fff;--hover:#e2e8f0;--text:#0f172a;--muted:#64748b;--accent:#2563eb;--success:#059669;--border:#cbd5e1}
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
body{background:var(--bg);color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.wrap{width:100%;max-width:420px}
.card{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:26px;box-shadow:0 20px 60px rgba(0,0,0,.35)}
h1{font-size:22px;font-weight:900;text-align:center;background:linear-gradient(135deg,#3b82f6,#1d4ed8);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:6px}
.sub{text-align:center;color:var(--muted);font-size:13px;margin-bottom:22px}
label{display:block;font-size:12px;font-weight:700;color:var(--muted);margin:14px 0 6px}
input{width:100%;background:var(--bg);color:var(--text);border:1px solid var(--border);padding:13px 14px;border-radius:12px;font-size:15px;outline:none}
input:focus{border-color:var(--accent)}
.btn{width:100%;display:block;text-align:center;background:linear-gradient(135deg,#3b82f6,#1d4ed8);color:#fff;border:0;padding:13px;border-radius:12px;font-size:15px;font-weight:800;margin-top:18px;cursor:pointer;text-decoration:none}
.btn:active{transform:scale(.98)}
.link{display:block;text-align:center;color:var(--accent);font-size:13px;margin-top:14px;cursor:pointer;background:none;border:0}
.msg{text-align:center;font-size:12px;margin-top:14px;min-height:16px}
.msg.err{color:#ef4444}.msg.ok{color:var(--success)}
/* выбор предмета */
.subjects{display:grid;gap:12px;margin-top:16px}
.subject{background:var(--bg);border:1px solid var(--border);border-radius:14px;padding:16px;cursor:pointer;text-decoration:none;color:var(--text);transition:border-color .15s,transform .06s}
.subject:hover{border-color:var(--accent)}
.subject:active{transform:scale(.98)}
.subject b{display:block;font-size:16px;margin-bottom:3px}
.subject span{font-size:12px;color:var(--muted)}
.subject .ico{font-size:22px;margin-right:10px}
.subject-row{display:flex;align-items:center}
.logout{color:var(--muted);font-size:12px;text-align:center;margin-top:18px;cursor:pointer;background:none;border:0}
.ai-sec{margin-top:16px;padding:14px;background:var(--bg);border:1px solid var(--border);border-radius:14px}
.ai-sec-title{font-size:12px;font-weight:800;color:var(--accent);margin-bottom:4px}
.ai-sec label{margin-top:12px}
.ai-sec .btn-sm{margin-top:14px;padding:11px;font-size:13px}
.ai-hint{font-size:11px;color:var(--muted);margin:6px 0 2px;line-height:1.4}
.btn-ghost{background:var(--bg);color:var(--accent);border:1px solid var(--accent)}
.invite-box{width:100%;margin-top:10px;background:var(--bg);color:var(--text);border:1px solid var(--accent);border-radius:10px;padding:10px;font-size:12px;font-family:monospace;resize:none;word-break:break-all}
@media(max-width:480px){.wrap{max-width:100%}body{padding:12px;padding-top:max(12px,env(safe-area-inset-top));padding-bottom:max(12px,env(safe-area-inset-bottom))}.card{padding:20px 18px;border-radius:16px}input{font-size:16px}.btn{min-height:48px}.subject{padding:14px}}
</style>
<script src="site-config.js"></script>
</head>
<body data-theme="dark">
<div class="wrap" id="wrap"></div>

<script>
const AUTH_KEY='ege_auth_user';
const SUBJECTS=[
 {id:'russian',file:'russian.html',name:'Русский язык',desc:'План 80+ • тренажёр • ИИ-репетитор',ico:'✍️'},
 {id:'math',file:'index-math.html',name:'Профильная математика',desc:'План 80+ • тренажёр • ИИ-репетитор',ico:'📐'},
 {id:'soc',file:'index-soc.html',name:'Обществознание',desc:'План 80+ • тренажёр • ИИ-репетитор',ico:'⚖️'},
 {id:'info',file:'index-info.html',name:'Информатика',desc:'План 80+ • тренажёр • ИИ-репетитор',ico:'💻'}
];

function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function getBridgeURL(){return (window.SITE_AI&&window.SITE_AI.url)||localStorage.getItem('ege_ai_url')||'';}
function getBridgeToken(){return (window.SITE_AI&&window.SITE_AI.token)||localStorage.getItem('ege_ai_token')||'';}
function authHeaders(){let t=getBridgeToken();const f=document.getElementById('aiToken');if(f&&f.value.trim())t=f.value.trim();return {'Content-Type':'application/json','Authorization':'Bearer '+t};}
function sessionToken(){return localStorage.getItem('ege_session')||'';}
function currentUser(){try{return JSON.parse(localStorage.getItem(AUTH_KEY)||'null');}catch(e){return null;}}
function clearLocalData(){['ege','ege_math','ege_soc','ege_info'].forEach(function(p){['weeks','history','errors','chat'].forEach(function(k){localStorage.removeItem(p+'_'+k);});});localStorage.removeItem('ege_completed_weeks');localStorage.removeItem('ege_test_history');localStorage.removeItem('ege_user_errors');localStorage.removeItem('ege_chat_history');}
function setSession(token,login){const prev=localStorage.getItem(AUTH_KEY);localStorage.setItem('ege_session',token||'');localStorage.setItem(AUTH_KEY,JSON.stringify({login:login||''}));if(prev){try{if(JSON.parse(prev).login!==login)clearLocalData();}catch(e){clearLocalData();}}}
async function apiPost(path,body){
 let url=getBridgeURL();
 const field=document.getElementById('aiUrl'); if(field&&field.value.trim()){url=field.value.trim().replace(/\/+$/,'');}
 if(!url) throw new Error('Нет URL AI-сервера: введи ссылку в поле «ИИ-репетитор».');
 const h=authHeaders(); const st=sessionToken(); if(st)h['X-Session-Token']=st;
 const r=await fetch(url+path,{method:'POST',headers:h,body:JSON.stringify(body||{})});
 let d={}; try{d=await r.json();}catch(e){}
 if(!r.ok) throw new Error(d.error||('HTTP '+r.status));
 return d;
}

const AI_PREFIXES=['ege','ege_math','ege_soc','ege_info'];
function aiValues(){
 const url=(document.getElementById('aiUrl')?.value||'').trim().replace(/\/+$/,'');
 const token=(document.getElementById('aiToken')?.value||'').trim();
 return {url,token};
}
function saveAI(){
 const {url,token}=aiValues();
  if(!url&&!token)return;
  AI_PREFIXES.forEach(p=>{
   if(url){localStorage.setItem(p+'_ai_url',url);}
   if(token){localStorage.setItem(p+'_ai_token',token);}
  });
 const msg=document.getElementById('msg');
 if(msg){msg.textContent='Настройки AI сохранены для всех предметов.';msg.className='msg ok';}
}
function persistAIFields(){
 const url=(document.getElementById('aiUrl')?.value||'').trim().replace(/\/+$/,'');
 const token=(document.getElementById('aiToken')?.value||'').trim();
 if(!url&&!token)return;
 AI_PREFIXES.forEach(p=>{
   if(url)localStorage.setItem(p+'_ai_url',url);
   if(token)localStorage.setItem(p+'_ai_token',token);
 });
}
function firstSaved(suffix){const keys=['ege','ege_math','ege_soc','ege_info'];for(let i=0;i<keys.length;i++){const v=localStorage.getItem(keys[i]+'_'+suffix);if(v&&v.trim())return v.trim();}return '';}
function loadAIIntoFields(){
 let u=firstSaved('ai_url');
 let t=firstSaved('ai_token');
 const cfg=window.SITE_AI||null;
 if(cfg&&cfg.url){u=cfg.url;if(cfg.token)t=cfg.token;}
 const el=document.getElementById('aiUrl'),te=document.getElementById('aiToken');
 if(el)el.value=u;
 if(te)te.value=t;
}
// --- ссылка-приглашение: #ai=<url>&tk=<token> передаёт настройки на другое устройство ---
function applyInviteFromHash(){
 let h=location.hash.replace(/^#/,''); if(!h)return false;
 let params; try{params=new URLSearchParams(h);}catch(e){return false;}
 const ai=params.get('ai'), tk=params.get('tk');
 if(!ai)return false;
 const url=decodeURIComponent(ai).trim().replace(/\/+$/,'');
 const token=(tk||'').trim();
 AI_PREFIXES.forEach(p=>{localStorage.setItem(p+'_ai_url',url); if(token)localStorage.setItem(p+'_ai_token',token);});
 history.replaceState(null,'',location.pathname+location.search);
 return true;
}
function buildInviteLink(){
 const {url,token}=aiValues();
 if(!url)return '';
 const base=location.origin+location.pathname;
 return base+'#ai='+encodeURIComponent(url)+(token?('&tk='+encodeURIComponent(token)):'');
}
function shareToPhone(){
 const link=buildInviteLink();
 if(!link){const m=document.getElementById('msg');if(m){m.textContent='Сначала укажи URL туннеля.';m.className='msg err';}return;}
 if(navigator.share){
   navigator.share({title:'ЕГЭ 80+ — вход',text:'Открой ссылку и войди',url:link}).catch(()=>{});
 }else{
   const box=document.getElementById('inviteBox');
   if(box){box.value=link;box.style.display='block';box.select();try{document.execCommand('copy');}catch(e){}}
   const m=document.getElementById('msg');if(m){m.textContent='Ссылка скопирована — отправь её на телефон.';m.className='msg ok';}
 }
}
function toggleInviteBox(){
 const box=document.getElementById('inviteBox');
 if(!box)return;
 if(box.style.display==='block'){box.style.display='none';return;}
 const link=buildInviteLink();
 if(!link){const m=document.getElementById('msg');if(m){m.textContent='Сначала укажи URL туннеля.';m.className='msg err';}return;}
 box.value=link;box.style.display='block';box.select();
 try{document.execCommand('copy');const m=document.getElementById('msg');if(m){m.textContent='Ссылка скопирована.';m.className='msg ok';}}catch(e){}
}

function renderLogin(){
 document.getElementById('wrap').innerHTML=`
  <div class="card">
    <h1>ЕГЭ 2026</h1>
    <div class="sub">Подготовка на 80+ по 4 предметам</div>
    <label>Логин</label><input id="login" autocomplete="off" placeholder="admin">
    <label>Пароль</label><input id="pass" type="password" placeholder="admin">
    <button class="btn" onclick="doLogin()">Войти</button>
    <button class="link" onclick="renderRegister()">Нет аккаунта? Зарегистрироваться</button>
    <div class="msg" id="msg"></div>
  </div>`;
 loadAIIntoFields();
}
function renderRegister(){
 document.getElementById('wrap').innerHTML=`
  <div class="card">
    <h1>Регистрация</h1>
    <div class="sub">Создание нового аккаунта</div>
    <label>Имя / логин</label><input id="reg-login" autocomplete="off" placeholder="например: petya">
    <label>Пароль</label><input id="reg-pass" type="password" placeholder="••••••">
    <label>Повторите пароль</label><input id="reg-pass2" type="password" placeholder="••••••">
    <button class="btn" onclick="doRegister()">Создать аккаунт</button>
    <button class="link" onclick="renderLogin()">Уже есть аккаунт? Войти</button>
    <div class="msg" id="msg"></div>
  </div>`;
 loadAIIntoFields();
}
function doLogin(){
 const l=document.getElementById('login').value.trim();
 const p=document.getElementById('pass').value;
 const msg=document.getElementById('msg');
 if(!l||!p){if(msg){msg.textContent='Заполни логин и пароль.';msg.className='msg err';}return;}
 const btn=document.querySelector('.btn'); if(btn){btn.disabled=true;btn.textContent='Вход...';}
 apiPost('/api/auth/login',{login:l,password:p}).then(d=>{
  setSession(d.token,d.user); saveAI(); goSubjects();
 }).catch(e=>{
  if(msg){msg.textContent=e.message;msg.className='msg err';}
  if(btn){btn.disabled=false;btn.textContent='Войти';}
 });
}
function doRegister(){
 const l=document.getElementById('reg-login').value.trim();
 const p1=document.getElementById('reg-pass').value;
 const p2=document.getElementById('reg-pass2').value;
 const msg=document.getElementById('msg');
 if(!l||!p1){if(msg){msg.textContent='Заполни логин и пароль.';msg.className='msg err';}return;}
 if(p1!==p2){if(msg){msg.textContent='Пароли не совпадают.';msg.className='msg err';}return;}
 const btn=document.querySelector('.btn'); if(btn){btn.disabled=true;btn.textContent='Создание...';}
 apiPost('/api/auth/register',{login:l,password:p1}).then(d=>{
  setSession(d.token,d.user); saveAI(); goSubjects();
 }).catch(e=>{
  if(msg){msg.textContent=e.message;msg.className='msg err';}
  if(btn){btn.disabled=false;btn.textContent='Создать аккаунт';}
 });
}
function goSubjects(){
 const user=currentUser()||{login:'admin'};
 document.getElementById('wrap').innerHTML=`
  <div class="card">
    <h1>★ Выбери предмет</h1>
    <div class="sub">Сейчас: ${esc(user.login)}</div>
    <div class="subjects">
      ${SUBJECTS.map(s=>`
        <a class="subject" href="${s.file}">
          <div class="subject-row"><span class="ico">${s.ico}</span><div><b>${esc(s.name)}</b><span>${esc(s.desc)}</span></div></div>
        </a>`).join('')}
    </div>
    <div class="ai-sec">
      <div class="ai-sec-title">🤖 ИИ-репетитор</div>
      <p class="ai-hint">Ссылка и токен применяются ко всем предметам.</p>
      <label>Ссылка (URL Cloudflare-туннеля)</label><input id="aiUrl" autocomplete="off" placeholder="https://....trycloudflare.com" oninput="persistAIFields()">
      <label>AI-токен</label><input id="aiToken" type="password" autocomplete="off" placeholder="AI Token" oninput="persistAIFields()">
      <button class="btn btn-sm" onclick="saveAI()">💾 Сохранить настройки AI</button>
      <button class="btn btn-sm btn-ghost" onclick="shareToPhone()">📲 Поделиться на телефон</button>
      <button class="btn btn-sm btn-ghost" onclick="toggleInviteBox()">🔗 Показать/скопировать ссылку</button>
      <textarea id="inviteBox" class="invite-box" readonly style="display:none" rows="3"></textarea>
      <div class="msg" id="msg"></div>
    </div>
    <button class="logout" onclick="logout()">Выйти</button>
  </div>`;
 loadAIIntoFields();
}
function logout(){
 const st=sessionToken();
 if(st){apiPost('/api/auth/logout',{}).catch(()=>{});}
 localStorage.removeItem('ege_session');
 localStorage.removeItem(AUTH_KEY);
 renderLogin();
}
applyInviteFromHash();
if(currentUser()&&sessionToken()){goSubjects();}else{
 if(currentUser()&&!sessionToken()){localStorage.removeItem(AUTH_KEY);}
 renderLogin();
}
</script>
</body>
</html>
